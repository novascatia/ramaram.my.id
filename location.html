<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free GPS Route Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 0; }
        .overlay-panel { z-index: 10; max-height: 90vh; overflow-y: auto; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Mobile responsive panel positioning */
        @media (max-width: 768px) {
            .tracker-panel { bottom: 1rem; top: auto; left: 1rem; right: 1rem; width: auto; max-height: 40vh; }
            .history-panel { top: 1rem; left: 1rem; right: 1rem; width: auto; max-height: 40vh; }
        }
    </style>
</head>
<body class="bg-gray-100 relative">

    <div id="map"></div>

    <div class="tracker-panel overlay-panel absolute top-4 left-4 w-72 bg-white/95 backdrop-blur shadow-xl rounded-xl p-5 flex flex-col gap-4 border border-gray-100 transition-all">
        <div>
            <h1 class="text-xl font-bold text-gray-800 tracking-tight">Route Tracker</h1>
            <div id="statusText" class="text-sm text-gray-500 font-medium">Ready to start</div>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Time</div>
                <div id="timeVal" class="text-lg font-bold text-gray-800">00:00:00</div>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Distance</div>
                <div id="distVal" class="text-lg font-bold text-gray-800">0.00 <span class="text-sm font-normal">km</span></div>
            </div>
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 col-span-2 flex justify-between items-end">
                <div>
                    <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Avg Speed</div>
                    <div id="speedVal" class="text-2xl font-bold text-blue-600">0.0 <span class="text-sm font-normal text-gray-500">km/h</span></div>
                </div>
                <div id="currentSpeedVal" class="text-sm font-medium text-gray-400 mb-1">0.0 km/h (now)</div>
            </div>
        </div>

        <div class="flex flex-col gap-2 mt-2">
            <button id="btnStart" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm shadow-green-500/30 transition-colors">Start Tracking</button>
            <button id="btnStop" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm shadow-red-500/30 transition-colors hidden">Stop & Save</button>
            <button id="btnClear" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-lg transition-colors border border-gray-200">Clear Map History</button>
        </div>
    </div>

    <div class="history-panel overlay-panel absolute top-4 right-4 w-80 bg-white/95 backdrop-blur shadow-xl rounded-xl p-5 border border-gray-100">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-bold text-gray-800 tracking-tight">Saved Sessions</h2>
            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-semibold">Local Storage</span>
        </div>
        <p class="text-xs text-gray-500 mb-3">Click a route to view and compare it on the map.</p>
        <div id="sessionList" class="flex flex-col gap-2 custom-scrollbar pr-1 max-h-[50vh] md:max-h-[70vh]">
            <!-- History items will be injected here -->
        </div>
    </div>

    <script>
        let map;
        let activePolyline;
        let routeCoords = [];
        let savedPolylines = [];
        
        let watchId = null;
        let isTracking = false;
        let startTime = null;
        let totalDistance = 0;
        let lastPos = null;
        let timerInterval = null;

        const ui = {
            time: document.getElementById('timeVal'),
            dist: document.getElementById('distVal'),
            avgSpeed: document.getElementById('speedVal'),
            curSpeed: document.getElementById('currentSpeedVal'),
            status: document.getElementById('statusText'),
            start: document.getElementById('btnStart'),
            stop: document.getElementById('btnStop'),
            clear: document.getElementById('btnClear'),
            list: document.getElementById('sessionList')
        };

        function initMap() {
            // Default center before geolocation kicks in
            map = L.map('map').setView([-6.2088, 106.8456], 13);
            
            // Using standard Free OpenStreetMap tiles. No API key needed.
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            // Polyline for the current active tracking session
            activePolyline = L.polyline([], {
                color: '#ef4444', 
                weight: 6, 
                opacity: 0.9, 
                lineJoin: 'round'
            }).addTo(map);

            // Try to locate user immediately to center the map
            map.locate({setView: true, maxZoom: 16});
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const earthRadiusKm = 6371;
            const p = Math.PI / 180;
            const a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 + 
                      Math.cos(lat1 * p) * Math.cos(lat2 * p) * 
                      (1 - Math.cos((lon2 - lon1) * p)) / 2;
            return 2 * earthRadiusKm * Math.asin(Math.sqrt(a));
        }

        function formatDuration(ms) {
            let totalSeconds = Math.floor(ms / 1000);
            let h = Math.floor(totalSeconds / 3600);
            let m = Math.floor((totalSeconds % 3600) / 60);
            let s = totalSeconds % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimerUI() {
            if (!isTracking || !startTime) return;
            const now = Date.now();
            const elapsedMs = now - startTime;
            ui.time.innerText = formatDuration(elapsedMs);
            
            // Update Average speed dynamically
            const elapsedHours = elapsedMs / (1000 * 60 * 60);
            if (elapsedHours > 0 && totalDistance > 0) {
                const avg = totalDistance / elapsedHours;
                ui.avgSpeed.innerHTML = `${avg.toFixed(1)} <span class="text-sm font-normal text-gray-500">km/h</span>`;
            }
        }

        function onPositionUpdate(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const now = Date.now();
            
            // If it's the first point, jump map to it
            if (routeCoords.length === 0) {
                map.setView([lat, lng], 17);
            } else {
                // Keep panning map to follow user smoothly
                map.panTo([lat, lng]);
            }
            
            routeCoords.push([lat, lng]);
            activePolyline.setLatLngs(routeCoords);

            if (lastPos) {
                const distDelta = calculateDistance(lastPos.lat, lastPos.lng, lat, lng);
                totalDistance += distDelta;
                
                // Calculate current instantaneous speed between the last two points
                const timeDeltaHours = (now - lastPos.time) / (1000 * 60 * 60);
                if (timeDeltaHours > 0) {
                    const currentSpd = distDelta / timeDeltaHours;
                    ui.curSpeed.innerText = `${currentSpd.toFixed(1)} km/h (now)`;
                }
            }

            lastPos = { lat, lng, time: now };
            ui.dist.innerHTML = `${totalDistance.toFixed(2)} <span class="text-sm font-normal">km</span>`;
        }

        function onPositionError(err) {
            console.warn("Geolocation error:", err);
            ui.status.innerText = "GPS Error. Check permissions.";
            ui.status.classList.add("text-red-500");
        }

        function startTracking() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }
            
            isTracking = true;
            startTime = Date.now();
            routeCoords = [];
            totalDistance = 0;
            lastPos = null;
            
            activePolyline.setLatLngs([]);
            ui.avgSpeed.innerHTML = `0.0 <span class="text-sm font-normal text-gray-500">km/h</span>`;
            ui.curSpeed.innerText = `0.0 km/h (now)`;
            
            ui.status.innerText = "Tracking active...";
            ui.status.classList.remove("text-red-500", "text-gray-500");
            ui.status.classList.add("text-green-500");
            
            ui.start.classList.add("hidden");
            ui.stop.classList.remove("hidden");
            
            timerInterval = setInterval(updateTimerUI, 1000);
            
            watchId = navigator.geolocation.watchPosition(
                onPositionUpdate, 
                onPositionError, 
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
            );
        }

        function stopTracking() {
            if (!isTracking) return;
            
            isTracking = false;
            const endTime = Date.now();
            
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            clearInterval(timerInterval);
            timerInterval = null;
            
            ui.status.innerText = "Session stopped and saved.";
            ui.status.classList.remove("text-green-500");
            ui.status.classList.add("text-gray-500");
            
            ui.stop.classList.add("hidden");
            ui.start.classList.remove("hidden");
            ui.curSpeed.innerText = `Stopped`;

            // Save session to Local Storage if there's actual data
            if (routeCoords.length > 1) {
                saveSession(startTime, endTime, totalDistance, routeCoords);
            }
        }

        function saveSession(start, end, distance, coords) {
            let sessions = JSON.parse(localStorage.getItem('gpsTrackerRoutes') || '[]');
            
            const newSession = {
                id: start.toString(), // use timestamp as unique ID
                startTime: start,
                endTime: end,
                distance: distance,
                coords: coords
            };
            
            sessions.push(newSession);
            localStorage.setItem('gpsTrackerRoutes', JSON.stringify(sessions));
            loadHistory();
        }

        function loadHistory() {
            const sessions = JSON.parse(localStorage.getItem('gpsTrackerRoutes') || '[]');
            ui.list.innerHTML = "";
            
            if (sessions.length === 0) {
                ui.list.innerHTML = `<div class="text-sm text-gray-500 p-3 text-center bg-gray-50 rounded border border-dashed border-gray-300">No saved routes yet.</div>`;
                return;
            }
            
            // Sort newest first
            sessions.sort((a, b) => b.startTime - a.startTime);
            
            sessions.forEach(session => {
                const startD = new Date(session.startTime);
                const dateStr = startD.toLocaleDateString() + " " + startD.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const durationStr = formatDuration(session.endTime - session.startTime);
                const distStr = (session.distance || 0).toFixed(2);
                
                // Calculate average speed for history display
                const hours = (session.endTime - session.startTime) / (1000 * 60 * 60);
                const avgSpeedStr = hours > 0 ? (session.distance / hours).toFixed(1) : "0.0";
                
                const itemHtml = `
                    <div class="history-item p-3 bg-gray-50 hover:bg-blue-50 border border-gray-100 rounded-lg cursor-pointer transition-colors group" data-id="${session.id}">
                        <div class="font-semibold text-sm text-gray-800 group-hover:text-blue-700">${dateStr}</div>
                        <div class="grid grid-cols-3 gap-1 mt-2 text-xs text-gray-600">
                            <div><span class="font-medium text-gray-400 block">Dist</span>${distStr} km</div>
                            <div><span class="font-medium text-gray-400 block">Time</span>${durationStr}</div>
                            <div><span class="font-medium text-gray-400 block">Speed</span>${avgSpeedStr} km/h</div>
                        </div>
                    </div>
                `;
                ui.list.insertAdjacentHTML('beforeend', itemHtml);
            });

            // Attach click listeners to draw the route
            document.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const sessionId = e.currentTarget.getAttribute('data-id');
                    drawHistoryRoute(sessionId, sessions);
                });
            });
        }

        function drawHistoryRoute(sessionId, sessions) {
            const session = sessions.find(s => s.id === sessionId);
            if (!session || !session.coords || session.coords.length === 0) return;

            // Generate a random color for comparison purposes, favoring cool colors
            const colors = ['#3b82f6', '#8b5cf6', '#0ea5e9', '#14b8a6', '#f59e0b', '#ec4899'];
            const color = colors[savedPolylines.length % colors.length];

            const newLine = L.polyline(session.coords, {
                color: color, 
                weight: 5, 
                opacity: 0.8, 
                dashArray: '8, 8' 
            }).addTo(map);
            
            // Add a start and end marker
            const startMarker = L.circleMarker(session.coords[0], { radius: 5, color: '#22c55e', fillOpacity: 1 }).addTo(map);
            const endMarker = L.circleMarker(session.coords[session.coords.length - 1], { radius: 5, color: '#ef4444', fillOpacity: 1 }).addTo(map);

            savedPolylines.push({ line: newLine, start: startMarker, end: endMarker });
            
            // Fit map to show the whole history route
            map.fitBounds(newLine.getBounds(), { padding: [50, 50] });
        }

        function clearMapHistory() {
            savedPolylines.forEach(item => {
                map.removeLayer(item.line);
                map.removeLayer(item.start);
                map.removeLayer(item.end);
            });
            savedPolylines = [];
            // Recenter to current active tracking line if it exists
            if (routeCoords.length > 0) {
                map.fitBounds(activePolyline.getBounds());
            } else {
                map.locate({setView: true, maxZoom: 16});
            }
        }

        window.onload = () => {
            initMap();
            loadHistory();
            
            ui.start.addEventListener('click', startTracking);
            ui.stop.addEventListener('click', stopTracking);
            ui.clear.addEventListener('click', clearMapHistory);
        };
    </script>
</body>
</html>
