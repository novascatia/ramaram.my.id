<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile GPS Route Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            background-color: #f3f4f6;
            touch-action: none;
        }
        #mapdiv { 
            width: 100vw; 
            height: 100vh; 
            z-index: 0; 
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #bottomsheet {
            height: 85vh;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 1000;
            background-color: white;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
            box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.1);
            will-change: transform;
            display: flex;
            flex-direction: column;
        }
        
        @media (min-width: 768px) {
            #bottomsheet {
                width: 400px;
                left: 50%;
                margin-left: -200px;
                border-radius: 1.5rem 1.5rem 0 0;
            }
        }

        #draghandle {
            touch-action: none; 
            cursor: grab;
            flex-shrink: 0;
        }
        
        #draghandle:active {
            cursor: grabbing;
        }

        #sheetcontent {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2rem;
            flex-grow: 1;
        }

        #sheetcontent::-webkit-scrollbar { width: 4px; }
        #sheetcontent::-webkit-scrollbar-track { background: transparent; }
        #sheetcontent::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .userdot {
            width: 18px;
            height: 18px;
            background-color: #2563eb;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .userdotpulse {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background-color: rgba(37, 99, 235, 0.4);
            animation: pulse 2s ease-out infinite;
            z-index: -1;
        }

        .userdotpaused {
            background-color: #f59e0b;
        }
        
        .userdotpulsepaused {
            background-color: rgba(245, 158, 11, 0.4);
        }
        
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        
        #toastmsg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="mapdiv"></div>
    
    <div id="toastmsg" class="bg-gray-800 text-white px-4 py-2 rounded-full text-sm font-medium opacity-0 shadow-lg"></div>

    <div id="bottomsheet">
        <div id="draghandle" class="w-full pt-4 pb-4 flex justify-center items-center bg-white rounded-t-[1.5rem]">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        
        <div id="sheetcontent" class="px-5">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h1 class="text-2xl font-black text-gray-900 tracking-tight">Route Tracker</h1>
                    <div id="elstatus" class="text-sm font-medium text-gray-500 mt-1">Locating GPS...</div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex flex-col justify-center shadow-sm">
                    <div class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-1">Time</div>
                    <div id="eltime" class="text-xl font-black text-gray-800 tabular-nums tracking-tight">00:00:00</div>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex flex-col justify-center shadow-sm">
                    <div class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-1">Distance</div>
                    <div class="flex items-baseline gap-1">
                        <div id="eldist" class="text-xl font-black text-gray-800 tabular-nums tracking-tight">0.00</div>
                        <div class="text-sm font-bold text-gray-500">km</div>
                    </div>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 col-span-2 flex justify-between items-center shadow-sm">
                    <div>
                        <div class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-1">Estimated Speed</div>
                        <div class="flex items-baseline gap-1">
                            <div id="elavgspeed" class="text-4xl font-black text-blue-600 tabular-nums tracking-tighter">0.0</div>
                            <div class="text-sm font-bold text-blue-600/70">km/h</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest font-bold mb-1">Current</div>
                        <div id="elcurspeed" class="text-lg font-black text-gray-700 tabular-nums tracking-tight">0.0 <span class="text-xs font-semibold text-gray-500">km/h</span></div>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 mb-6">
                <button id="btnstart" class="flex-1 bg-blue-600 active:bg-blue-700 text-white font-bold text-lg py-3 rounded-xl shadow-lg shadow-blue-600/30 transition-transform active:scale-[0.97]">
                    Start
                </button>
                <button id="btnpause" class="flex-1 bg-orange-500 active:bg-orange-600 text-white font-bold text-lg py-3 rounded-xl shadow-lg shadow-orange-500/30 transition-transform active:scale-[0.97] hidden">
                    Pause
                </button>
                <button id="btnresume" class="flex-1 bg-green-500 active:bg-green-600 text-white font-bold text-lg py-3 rounded-xl shadow-lg shadow-green-500/30 transition-transform active:scale-[0.97] hidden">
                    Resume
                </button>
                <button id="btnstop" class="flex-1 bg-red-500 active:bg-red-600 text-white font-bold text-lg py-3 rounded-xl shadow-lg shadow-red-500/30 transition-transform active:scale-[0.97] hidden">
                    Stop
                </button>
                <button id="btnsave" class="flex-1 bg-green-600 active:bg-green-700 text-white font-bold text-lg py-3 rounded-xl shadow-lg shadow-green-600/30 transition-transform active:scale-[0.97] hidden">
                    Save Route
                </button>
            </div>

            <div class="border-t border-gray-100 pt-5 mt-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-black text-gray-900 tracking-tight">Saved Routes</h2>
                    <button id="btnclear" class="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg active:bg-red-100 transition-colors">Clear Map</button>
                </div>
                <div id="listhistory" class="flex flex-col gap-3">
                </div>
            </div>
        </div>
    </div>

    <script>
        let themap;
        let usermarker;
        let trackpolyline;
        
        let watchid = null;
        let wakelockobj = null;
        
        let istracking = false;
        let ispaused = false;
        
        let starttimems = null;
        let lastupdatetimems = null;
        let elapsedtimems = 0;
        
        let totalkm = 0;
        let lastloc = null;
        let timerinterval = null;
        
        let curlat = 0;
        let curlng = 0;
        
        let routecoords = [[]]; 
        let cursegment = 0;
        let savedrouteslayers = [];

        const eltime = document.getElementById('eltime');
        const eldist = document.getElementById('eldist');
        const elavgspeed = document.getElementById('elavgspeed');
        const elcurspeed = document.getElementById('elcurspeed');
        const elstatus = document.getElementById('elstatus');
        
        const btnstart = document.getElementById('btnstart');
        const btnpause = document.getElementById('btnpause');
        const btnresume = document.getElementById('btnresume');
        const btnstop = document.getElementById('btnstop');
        const btnsave = document.getElementById('btnsave');
        const btnclear = document.getElementById('btnclear');
        
        const listhistory = document.getElementById('listhistory');
        const bottomsheet = document.getElementById('bottomsheet');
        const draghandle = document.getElementById('draghandle');
        const toastmsg = document.getElementById('toastmsg');

        let winheight = window.innerHeight;
        let sheetheight = winheight * 0.85; 
        
        let expandedy = 0;
        let halfy = winheight * 0.35;
        let collapsedy = winheight * 0.70;
        
        let curtranslatey = collapsedy;
        let starttouchy = 0;
        let starttranslatey = 0;

        function initmap() {
            themap = L.map('mapdiv', { 
                zoomControl: false,
                attributionControl: false 
            }).setView([0, 0], 16);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(themap);

            trackpolyline = L.polyline([], {
                color: '#2563eb', 
                weight: 6, 
                opacity: 0.9, 
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(themap);

            const iconhtml = `
                <div class='userdot' id='userdotinner'>
                    <div class='userdotpulse' id='userdotpulseinner'></div>
                </div>
            `;
            
            const customicon = L.divIcon({
                className: 'custom-icon',
                html: iconhtml,
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });
            
            usermarker = L.marker([0, 0], { 
                icon: customicon, 
                zIndexOffset: 1000 
            }).addTo(themap);
            
            usermarker.setOpacity(0);
            bottomsheet.style.transform = `translateY(${curtranslatey}px)`;
        }

        function setupsheet() {
            window.addEventListener('resize', () => {
                winheight = window.innerHeight;
                sheetheight = winheight * 0.85;
                expandedy = 0;
                halfy = winheight * 0.35;
                collapsedy = winheight * 0.70;
                snapclosest(curtranslatey);
            });

            draghandle.addEventListener('touchstart', (e) => {
                starttouchy = e.touches[0].clientY;
                starttranslatey = curtranslatey;
                bottomsheet.style.transition = 'none';
            }, { passive: true });

            draghandle.addEventListener('touchmove', (e) => {
                const deltay = e.touches[0].clientY - starttouchy;
                let newy = starttranslatey + deltay;
                
                if (newy < expandedy) newy = expandedy;
                if (newy > collapsedy) newy = collapsedy;
                
                curtranslatey = newy;
                bottomsheet.style.transform = `translateY(${curtranslatey}px)`;
                
                if (curlat !== 0 && curlng !== 0) {
                    centermap();
                }
            }, { passive: true });

            draghandle.addEventListener('touchend', () => {
                bottomsheet.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
                snapclosest(curtranslatey);
            });
        }

        function snapclosest(ypos) {
            const distexpanded = Math.abs(ypos - expandedy);
            const disthalf = Math.abs(ypos - halfy);
            const distcollapsed = Math.abs(ypos - collapsedy);
            const mindist = Math.min(distexpanded, disthalf, distcollapsed);

            if (mindist === distexpanded) {
                curtranslatey = expandedy;
            } else if (mindist === disthalf) {
                curtranslatey = halfy;
            } else {
                curtranslatey = collapsedy;
            }

            bottomsheet.style.transform = `translateY(${curtranslatey}px)`;
            
            setTimeout(() => {
                if (curlat !== 0 && curlng !== 0) {
                    centermap();
                }
            }, 310);
        }

        function centermap() {
            if (curlat === 0 || curlng === 0) return;

            const visibleheight = sheetheight - curtranslatey;
            const zoomlvl = themap.getZoom() || 17;
            const latlngobj = L.latLng(curlat, curlng);
            
            let targetpt = themap.project(latlngobj, zoomlvl);
            targetpt.y += (visibleheight / 2);
            
            const offsetcenter = themap.unproject(targetpt, zoomlvl);
            themap.panTo(offsetcenter, { animate: true, duration: 0.5 });
        }

        function calcdist(lat1, lon1, lat2, lon2) {
            const rad = 6371; 
            const p = Math.PI / 180;
            const a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 + 
                      Math.cos(lat1 * p) * Math.cos(lat2 * p) * 
                      (1 - Math.cos((lon2 - lon1) * p)) / 2;
            return 2 * rad * Math.asin(Math.sqrt(a));
        }

        function formatms(ms) {
            const totalsec = Math.floor(ms / 1000);
            const hrs = Math.floor(totalsec / 3600);
            const mins = Math.floor((totalsec % 3600) / 60);
            const secs = totalsec % 60;
            return hrs.toString().padStart(2, '0') + ':' + 
                   mins.toString().padStart(2, '0') + ':' + 
                   secs.toString().padStart(2, '0');
        }

        function timerupdate() {
            if (!istracking || ispaused) return;
            
            const now = Date.now();
            const delta = now - lastupdatetimems;
            elapsedtimems += delta;
            lastupdatetimems = now;
            
            eltime.innerText = formatms(elapsedtimems);
            
            const hourstracked = elapsedtimems / 3600000;
            if (hourstracked > 0 && totalkm > 0) {
                const avgspeed = totalkm / hourstracked;
                elavgspeed.innerText = avgspeed.toFixed(1);
            }
        }
        
        function calltoast(msg) {
            toastmsg.innerText = msg;
            toastmsg.style.opacity = 1;
            setTimeout(() => { toastmsg.style.opacity = 0; }, 3000);
        }

        async function reqwakelock() {
            try {
                if ('wakeLock' in navigator) {
                    wakelockobj = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock Error', err);
            }
        }

        function freewakelock() {
            if (wakelockobj !== null) {
                wakelockobj.release().then(() => { wakelockobj = null; });
            }
        }

        function setdotpaused(paused) {
            const dot = document.getElementById('userdotinner');
            const pulse = document.getElementById('userdotpulseinner');
            if(dot && pulse) {
                if(paused) {
                    dot.classList.add('userdotpaused');
                    pulse.classList.add('userdotpulsepaused');
                } else {
                    dot.classList.remove('userdotpaused');
                    pulse.classList.remove('userdotpulsepaused');
                }
            }
        }

        function locationupdate(pos) {
            curlat = pos.coords.latitude;
            curlng = pos.coords.longitude;
            
            usermarker.setLatLng([curlat, curlng]);
            usermarker.setOpacity(1);
            
            centermap();

            if (!istracking) {
                elstatus.innerText = "GPS Ready. Accurate & Centered.";
                elstatus.className = "text-sm font-semibold text-blue-500 mt-1";
            } else if (istracking && !ispaused) {
                routecoords[cursegment].push([curlat, curlng]);
                trackpolyline.setLatLngs(routecoords);

                if (lastloc) {
                    const dist = calcdist(lastloc.lat, lastloc.lng, curlat, curlng);
                    totalkm += dist;
                    
                    const timehrs = (Date.now() - lastloc.time) / 3600000;
                    if (timehrs > 0) {
                        const curspd = dist / timehrs;
                        elcurspeed.innerHTML = curspd.toFixed(1) + ' <span class="text-xs font-semibold text-gray-500">km/h</span>';
                    }
                }

                lastloc = { lat: curlat, lng: curlng, time: Date.now() };
                eldist.innerText = totalkm.toFixed(2);
            }
        }

        function locationerror(err) {
            elstatus.innerText = "GPS Error. Check location permissions.";
            elstatus.className = "text-sm font-semibold text-red-500 mt-1";
            calltoast("Failed to acquire GPS location.");
        }

        function actionstart() {
            istracking = true;
            ispaused = false;
            
            starttimems = Date.now();
            lastupdatetimems = starttimems;
            elapsedtimems = 0;
            totalkm = 0;
            lastloc = null;
            
            cursegment = 0;
            routecoords = [[]];
            trackpolyline.setLatLngs([]);
            
            elavgspeed.innerText = "0.0";
            elcurspeed.innerHTML = '0.0 <span class="text-xs font-semibold text-gray-500">km/h</span>';
            eldist.innerText = "0.00";
            
            elstatus.innerText = "Tracking active...";
            elstatus.className = "text-sm font-bold text-green-500 mt-1";
            setdotpaused(false);
            
            btnstart.classList.add("hidden");
            btnpause.classList.remove("hidden");
            btnstop.classList.remove("hidden");
            btnsave.classList.add("hidden");
            btnresume.classList.add("hidden");
            
            curtranslatey = collapsedy;
            bottomsheet.style.transition = 'transform 0.4s ease';
            bottomsheet.style.transform = `translateY(${curtranslatey}px)`;
            
            timerinterval = setInterval(timerupdate, 1000);
            reqwakelock();

            if (curlat !== 0 && curlng !== 0) {
                routecoords[cursegment].push([curlat, curlng]);
                lastloc = { lat: curlat, lng: curlng, time: Date.now() };
                setTimeout(() => centermap(), 400); 
            }
        }

        function actionpause() {
            ispaused = true;
            elstatus.innerText = "Paused. Moving will not record distance.";
            elstatus.className = "text-sm font-bold text-orange-500 mt-1";
            setdotpaused(true);
            
            btnpause.classList.add("hidden");
            btnresume.classList.remove("hidden");
            elcurspeed.innerHTML = '0.0 <span class="text-xs font-semibold text-gray-500">km/h</span>';
            
            timerupdate(); // One final flush of elapsed time
        }

        function actionresume() {
            ispaused = false;
            lastupdatetimems = Date.now();
            
            // Create a new line segment so paused movement isn't connected
            cursegment++;
            routecoords[cursegment] = [];
            
            if (curlat !== 0 && curlng !== 0) {
                routecoords[cursegment].push([curlat, curlng]);
                lastloc = { lat: curlat, lng: curlng, time: Date.now() };
            } else {
                lastloc = null;
            }

            elstatus.innerText = "Tracking active...";
            elstatus.className = "text-sm font-bold text-green-500 mt-1";
            setdotpaused(false);
            
            btnresume.classList.add("hidden");
            btnpause.classList.remove("hidden");
        }

        function actionstop() {
            istracking = false;
            ispaused = false;
            freewakelock();
            
            clearInterval(timerinterval);
            timerinterval = null;
            
            elstatus.innerText = "Session stopped. Ready to save.";
            elstatus.className = "text-sm font-semibold text-red-500 mt-1";
            setdotpaused(false);
            
            btnstop.classList.add("hidden");
            btnpause.classList.add("hidden");
            btnresume.classList.add("hidden");
            btnstart.classList.add("hidden");
            btnsave.classList.remove("hidden");
            
            elcurspeed.innerHTML = '0.0 <span class="text-xs font-semibold text-gray-500">km/h</span>';
            
            curtranslatey = halfy;
            bottomsheet.style.transition = 'transform 0.4s ease';
            bottomsheet.style.transform = `translateY(${curtranslatey}px)`;
            setTimeout(() => centermap(), 400);
        }

        function actionsave() {
            if (totalkm > 0 || elapsedtimems > 0) {
                let saveditems = JSON.parse(localStorage.getItem('mygpsroutes') || '[]');
                let newrecord = {
                    id: Date.now().toString(),
                    stamp: Date.now(),
                    durms: elapsedtimems,
                    dist: totalkm,
                    segments: routecoords
                };
                saveditems.push(newrecord);
                localStorage.setItem('mygpsroutes', JSON.stringify(saveditems));
                loadhistory();
            }
            
            btnsave.classList.add("hidden");
            btnstart.classList.remove("hidden");
            elstatus.innerText = "Route saved successfully.";
            elstatus.className = "text-sm font-semibold text-green-600 mt-1";
            calltoast("Route saved!");
        }

        function loadhistory() {
            let items = JSON.parse(localStorage.getItem('mygpsroutes') || '[]');
            listhistory.innerHTML = "";
            
            if (items.length === 0) {
                listhistory.innerHTML = '<div class="text-sm text-gray-400 p-4 text-center bg-gray-50 rounded-xl border border-dashed border-gray-200 font-medium">No saved routes yet.</div>';
                return;
            }
            
            items.sort((a, b) => b.stamp - a.stamp);
            
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const dateobj = new Date(item.stamp);
                const datestr = dateobj.toLocaleDateString() + " " + dateobj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const durstr = formatms(item.durms);
                const distval = (item.dist || 0).toFixed(2);
                
                const tmhrs = item.durms / 3600000;
                const spdval = tmhrs > 0 ? (item.dist / tmhrs).toFixed(1) : "0.0";
                
                const elcard = document.createElement('div');
                elcard.className = "p-4 bg-gray-50 active:bg-blue-50 border border-gray-100 rounded-2xl cursor-pointer transition-colors shadow-sm";
                elcard.onclick = () => drawhistory(item.id); 
                elcard.innerHTML = `
                    <div class="font-black text-sm text-gray-800 mb-2">${datestr}</div>
                    <div class="grid grid-cols-3 gap-2 text-xs text-gray-700">
                        <div class="bg-white p-2 rounded-xl border border-gray-100"><span class="text-[10px] uppercase text-gray-400 font-bold block mb-0.5 tracking-wider">Dist</span><span class="font-bold">${distval}</span> km</div>
                        <div class="bg-white p-2 rounded-xl border border-gray-100"><span class="text-[10px] uppercase text-gray-400 font-bold block mb-0.5 tracking-wider">Time</span><span class="font-bold">${durstr}</span></div>
                        <div class="bg-white p-2 rounded-xl border border-gray-100"><span class="text-[10px] uppercase text-gray-400 font-bold block mb-0.5 tracking-wider">Speed</span><span class="font-bold">${spdval}</span></div>
                    </div>
                `;
                listhistory.appendChild(elcard);
            }
        }

        function drawhistory(reqid) {
            let items = JSON.parse(localStorage.getItem('mygpsroutes') || '[]');
            let picked = null;
            for (let i = 0; i < items.length; i++) {
                if (items[i].id === reqid) {
                    picked = items[i];
                    break;
                }
            }
            if (!picked || !picked.segments) return;

            const pallete = ['#8b5cf6', '#0ea5e9', '#14b8a6', '#f59e0b', '#ec4899'];
            const pcolor = pallete[savedrouteslayers.length % pallete.length];

            const drawline = L.polyline(picked.segments, {
                color: pcolor, 
                weight: 5, 
                opacity: 0.8, 
                dashArray: '10, 10',
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(themap);
            
            let bounds = drawline.getBounds();
            if(Object.keys(bounds).length > 0) {
                savedrouteslayers.push({ lineobj: drawline });
                
                curtranslatey = collapsedy;
                bottomsheet.style.transition = 'transform 0.4s ease';
                bottomsheet.style.transform = `translateY(${curtranslatey}px)`;
                
                setTimeout(() => {
                    const visheight = sheetheight - curtranslatey;
                    themap.fitBounds(bounds, {
                        paddingBottomRight: [0, visheight + 20],
                        paddingTopLeft: [0, 20],
                        animate: true
                    });
                }, 400);
            }
        }

        function clearmap() {
            for (let i = 0; i < savedrouteslayers.length; i++) {
                themap.removeLayer(savedrouteslayers[i].lineobj);
            }
            savedrouteslayers = [];
            
            if (curlat !== 0 && curlng !== 0) {
                centermap();
            }
            calltoast("Map cleared");
        }

        window.onload = function() {
            initmap();
            setupsheet();
            loadhistory();
            
            if (navigator.geolocation) {
                watchid = navigator.geolocation.watchPosition(
                    locationupdate, 
                    locationerror, 
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            } else {
                elstatus.innerText = "Geolocation not supported.";
                elstatus.className = "text-sm font-semibold text-red-500 mt-1";
            }
            
            btnstart.onclick = actionstart;
            btnpause.onclick = actionpause;
            btnresume.onclick = actionresume;
            btnstop.onclick = actionstop;
            btnsave.onclick = actionsave;
            btnclear.onclick = clearmap;
            
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === 'visible' && istracking && !ispaused) {
                    reqwakelock(); 
                }
            });
        };
    </script>
</body>
</html>
