
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile GPS Route Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            background-color: #f3f4f6;
            touch-action: none;
        }
        #map { 
            width: 100vw; 
            height: 100vh; 
            z-index: 0; 
        }
        
        .bottompanel { 
            z-index: 1000; 
            box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.1);
            max-height: 60vh;
            display: flex;
            flex-direction: column;
        }
        
        .panelcontent {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .panelcontent::-webkit-scrollbar { width: 4px; }
        .panelcontent::-webkit-scrollbar-track { background: transparent; }
        .panelcontent::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        @media (min-width: 768px) {
            .bottompanel { 
                max-width: 400px; 
                left: 1rem; 
                bottom: 1rem; 
                border-radius: 1.5rem; 
                max-height: 80vh; 
                position: absolute;
            }
        }

        .userdot {
            width: 16px;
            height: 16px;
            background-color: #3b82f6;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
            position: relative;
        }
        .userdot::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background-color: rgba(59, 130, 246, 0.4);
            animation: pulse 2s ease-out infinite;
            z-index: -1;
        }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="relative h-screen w-screen flex flex-col justify-end md:justify-center">

    <div id="map" class="absolute inset-0"></div>

    <div class="bottompanel bg-white w-full rounded-t-[2rem] absolute bottom-0 left-0">
        <div class="w-full flex justify-center py-3 shrink-0 bg-white rounded-t-[2rem]">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        
        <div class="panelcontent px-5 pb-6 flex-1 bg-white">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Route Tracker</h1>
                    <div id="elstatus" class="text-sm font-medium text-gray-500 mt-1">Locating GPS...</div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex flex-col justify-center">
                    <div class="text-xs text-gray-500 uppercase tracking-widest font-bold mb-1">Time</div>
                    <div id="eltime" class="text-xl font-black text-gray-800 tabular-nums">00:00:00</div>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 flex flex-col justify-center">
                    <div class="text-xs text-gray-500 uppercase tracking-widest font-bold mb-1">Distance</div>
                    <div class="flex items-baseline gap-1">
                        <div id="eldist" class="text-xl font-black text-gray-800 tabular-nums">0.00</div>
                        <div class="text-sm font-semibold text-gray-500">km</div>
                    </div>
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 col-span-2 flex justify-between items-center">
                    <div>
                        <div class="text-xs text-gray-500 uppercase tracking-widest font-bold mb-1">Estimated Speed</div>
                        <div class="flex items-baseline gap-1">
                            <div id="elavgspeed" class="text-3xl font-black text-blue-600 tabular-nums">0.0</div>
                            <div class="text-sm font-semibold text-blue-600/70">km/h</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-[10px] text-gray-400 uppercase tracking-widest font-bold mb-1">Current</div>
                        <div id="elcurspeed" class="text-lg font-bold text-gray-700 tabular-nums">0.0 <span class="text-xs font-normal">km/h</span></div>
                    </div>
                </div>
            </div>

            <div class="flex gap-2 mb-6">
                <button id="btnstart" class="flex-1 bg-blue-600 active:bg-blue-700 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-blue-600/30 transition-transform active:scale-[0.98]">
                    Start
                </button>
                <button id="btnstop" class="flex-1 bg-orange-500 active:bg-orange-600 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-orange-500/30 transition-transform active:scale-[0.98] hidden">
                    Stop
                </button>
                <button id="btnsave" class="flex-1 bg-green-500 active:bg-green-600 text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-green-500/30 transition-transform active:scale-[0.98] hidden">
                    Save Route
                </button>
            </div>

            <div class="border-t border-gray-100 pt-5 mt-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-900 tracking-tight">Saved Routes</h2>
                    <button id="btnclear" class="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg active:bg-red-100">Clear Map</button>
                </div>
                <div id="listhistory" class="flex flex-col gap-3">
                </div>
            </div>
        </div>
    </div>

    <script>
        let map;
        let polyline;
        let coords = [];
        let savedroutes = [];
        let watchid = null;
        let tracking = false;
        let startms = null;
        let endms = null;
        let dist = 0;
        let lastloc = null;
        let timer = null;
        let marker = null;
        let lat = 0;
        let lng = 0;

        let eltime = document.getElementById('eltime');
        let eldist = document.getElementById('eldist');
        let elavgspeed = document.getElementById('elavgspeed');
        let elcurspeed = document.getElementById('elcurspeed');
        let elstatus = document.getElementById('elstatus');
        let btnstart = document.getElementById('btnstart');
        let btnstop = document.getElementById('btnstop');
        let btnsave = document.getElementById('btnsave');
        let btnclear = document.getElementById('btnclear');
        let listhistory = document.getElementById('listhistory');

        function initmap() {
            map = L.map('map', { 
                zoomControl: false,
                attributionControl: false 
            }).setView([0, 0], 16);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            polyline = L.polyline([], {
                color: '#2563eb', 
                weight: 6, 
                opacity: 0.9, 
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(map);

            let icon = L.divIcon({
                className: 'customicon',
                html: "<div class='userdot'></div>",
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            
            marker = L.marker([0, 0], { icon: icon, zIndexOffset: 1000 }).addTo(map);
            marker.setOpacity(0);
        }

        function calcdist(lat1, lon1, lat2, lon2) {
            let r = 6371;
            let p = Math.PI / 180;
            let a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 + 
                    Math.cos(lat1 * p) * Math.cos(lat2 * p) * 
                    (1 - Math.cos((lon2 - lon1) * p)) / 2;
            return 2 * r * Math.asin(Math.sqrt(a));
        }

        function formatms(ms) {
            let s = Math.floor(ms / 1000);
            let hr = Math.floor(s / 3600);
            let min = Math.floor((s % 3600) / 60);
            let sec = s % 60;
            return hr.toString().padStart(2, '0') + ':' + 
                   min.toString().padStart(2, '0') + ':' + 
                   sec.toString().padStart(2, '0');
        }

        function updatetimer() {
            if (!tracking || !startms) return;
            let now = Date.now();
            let elapsed = now - startms;
            eltime.innerText = formatms(elapsed);
            
            let h = elapsed / 3600000;
            if (h > 0 && dist > 0) {
                let avg = dist / h;
                elavgspeed.innerText = avg.toFixed(1);
            }
        }

        function onlocation(pos) {
            lat = pos.coords.latitude;
            lng = pos.coords.longitude;
            let now = Date.now();
            
            marker.setLatLng([lat, lng]);
            marker.setOpacity(1);
            
            map.setView([lat, lng], map.getZoom() || 17);

            if (!tracking) {
                elstatus.innerText = "GPS Ready. User centered.";
                elstatus.className = "text-sm font-medium text-blue-500 mt-1";
            } else {
                coords.push([lat, lng]);
                polyline.setLatLngs(coords);

                if (lastloc) {
                    let d = calcdist(lastloc.lat, lastloc.lng, lat, lng);
                    dist += d;
                    
                    let timeh = (now - lastloc.time) / 3600000;
                    if (timeh > 0) {
                        let curspd = d / timeh;
                        elcurspeed.innerHTML = curspd.toFixed(1) + ' <span class="text-xs font-normal">km/h</span>';
                    }
                }

                lastloc = { lat: lat, lng: lng, time: now };
                eldist.innerText = dist.toFixed(2);
            }
        }

        function onerror(err) {
            elstatus.innerText = "GPS Error. Check location permissions.";
            elstatus.className = "text-sm font-medium text-red-500 mt-1";
        }

        function starttrack() {
            tracking = true;
            startms = Date.now();
            endms = null;
            coords = [];
            dist = 0;
            lastloc = null;
            
            polyline.setLatLngs([]);
            elavgspeed.innerText = "0.0";
            elcurspeed.innerHTML = '0.0 <span class="text-xs font-normal">km/h</span>';
            eldist.innerText = "0.00";
            
            elstatus.innerText = "Tracking active...";
            elstatus.className = "text-sm font-medium text-green-500 mt-1";
            
            btnstart.classList.add("hidden");
            btnstop.classList.remove("hidden");
            btnsave.classList.add("hidden");
            
            timer = setInterval(updatetimer, 1000);

            if (lat !== 0 && lng !== 0) {
                coords.push([lat, lng]);
                lastloc = { lat: lat, lng: lng, time: startms };
                map.setView([lat, lng], 17);
            }
        }

        function stoptrack() {
            tracking = false;
            endms = Date.now();
            
            clearInterval(timer);
            timer = null;
            
            elstatus.innerText = "Session stopped. Ready to save.";
            elstatus.className = "text-sm font-medium text-orange-500 mt-1";
            
            btnstop.classList.add("hidden");
            btnstart.classList.add("hidden");
            btnsave.classList.remove("hidden");
            
            elcurspeed.innerHTML = '0.0 <span class="text-xs font-normal">km/h</span>';
        }

        function saveroute() {
            if (coords.length > 1) {
                let items = JSON.parse(localStorage.getItem('mygpsroutes') || '[]');
                let item = {
                    id: startms.toString(),
                    start: startms,
                    end: endms,
                    d: dist,
                    pts: coords
                };
                items.push(item);
                localStorage.setItem('mygpsroutes', JSON.stringify(items));
                loadhistory();
            }
            
            btnsave.classList.add("hidden");
            btnstart.classList.remove("hidden");
            elstatus.innerText = "Route saved successfully.";
            elstatus.className = "text-sm font-medium text-green-600 mt-1";
        }

        function loadhistory() {
            let items = JSON.parse(localStorage.getItem('mygpsroutes') || '[]');
            listhistory.innerHTML = "";
            
            if (items.length === 0) {
                listhistory.innerHTML = '<div class="text-sm text-gray-400 p-4 text-center bg-gray-50 rounded-xl border border-dashed border-gray-200">No saved routes yet.</div>';
                return;
            }
            
            items.sort(function(a, b) { return b.start - a.start; });
            
            for (let i = 0; i < items.length; i++) {
                let d = new Date(items[i].start);
                let dstr = d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let dur = formatms(items[i].end - items[i].start);
                let dval = (items[i].d || 0).toFixed(2);
                
                let h = (items[i].end - items[i].start) / 3600000;
                let spd = h > 0 ? (items[i].d / h).toFixed(1) : "0.0";
                
                let box = document.createElement('div');
                box.className = "p-4 bg-gray-50 active:bg-blue-50 border border-gray-100 rounded-2xl cursor-pointer transition-colors";
                box.onclick = function() { drawroute(items[i].id); };
                box.innerHTML = '<div class="font-bold text-sm text-gray-800 mb-2">' + dstr + '</div>' +
                    '<div class="grid grid-cols-3 gap-2 text-xs text-gray-700">' +
                        '<div class="bg-white p-2 rounded-lg border border-gray-100"><span class="text-[10px] uppercase text-gray-400 font-bold block mb-0.5">Dist</span>' + dval + ' km</div>' +
                        '<div class="bg-white p-2 rounded-lg border border-gray-100"><span class="text-[10px] uppercase text-gray-400 font-bold block mb-0.5">Time</span>' + dur + '</div>' +
                        '<div class="bg-white p-2 rounded-lg border border-gray-100"><span class="text-[10px] uppercase text-gray-400 font-bold block mb-0.5">Speed</span>' + spd + '</div>' +
                    '</div>';
                listhistory.appendChild(box);
            }
        }

        function drawroute(rid) {
            let items = JSON.parse(localStorage.getItem('mygpsroutes') || '[]');
            let item = null;
            for (let i = 0; i < items.length; i++) {
                if (items[i].id === rid) {
                    item = items[i];
                    break;
                }
            }
            if (!item || !item.pts || item.pts.length === 0) return;

            let colors = ['#8b5cf6', '#0ea5e9', '#14b8a6', '#f59e0b', '#ec4899'];
            let color = colors[savedroutes.length % colors.length];

            let line = L.polyline(item.pts, {
                color: color, 
                weight: 5, 
                opacity: 0.8, 
                dashArray: '10, 10',
                lineJoin: 'round',
                lineCap: 'round'
            }).addTo(map);
            
            let mstart = L.circleMarker(item.pts[0], { radius: 6, color: '#fff', fillColor: '#22c55e', fillOpacity: 1, weight: 2 }).addTo(map);
            let mend = L.circleMarker(item.pts[item.pts.length - 1], { radius: 6, color: '#fff', fillColor: '#ef4444', fillOpacity: 1, weight: 2 }).addTo(map);

            savedroutes.push({ l: line, s: mstart, e: mend });
        }

        function clearmap() {
            for (let i = 0; i < savedroutes.length; i++) {
                map.removeLayer(savedroutes[i].l);
                map.removeLayer(savedroutes[i].s);
                map.removeLayer(savedroutes[i].e);
            }
            savedroutes = [];
            
            if (lat !== 0 && lng !== 0) {
                map.setView([lat, lng], 17);
            }
        }

        window.onload = function() {
            initmap();
            loadhistory();
            
            if (navigator.geolocation) {
                watchid = navigator.geolocation.watchPosition(
                    onlocation, 
                    onerror, 
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                );
            } else {
                elstatus.innerText = "Geolocation not supported.";
                elstatus.className = "text-sm font-medium text-red-500 mt-1";
            }
            
            btnstart.onclick = starttrack;
            btnstop.onclick = stoptrack;
            btnsave.onclick = saveroute;
            btnclear.onclick = clearmap;
        };
    </script>
</body>
</html>
