<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Browser</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #ffffff;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        .container.active {
            justify-content: flex-start;
            height: 60px;
            background-color: #f1f3f4;
            border-bottom: 1px solid #dfe1e5;
            flex-direction: row;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 84px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: -5px;
            transition: all 0.4s ease;
        }

        .container.active .logo {
            font-size: 20px;
            margin-bottom: 0;
            margin-right: 20px;
            letter-spacing: -1px;
        }

        .logo span:nth-child(1) { color: #4285f4; }
        .logo span:nth-child(2) { color: #ea4335; }
        .logo span:nth-child(3) { color: #fbbc05; }
        .logo span:nth-child(4) { color: #4285f4; }
        .logo span:nth-child(5) { color: #34a853; }
        .logo span:nth-child(6) { color: #ea4335; }
        
        .search-box {
            width: 584px;
            max-width: 90%;
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 0 14px;
            height: 44px;
            background-color: #ffffff;
            transition: all 0.4s ease;
        }

        .container.active .search-box {
            width: 400px;
            height: 36px;
            border-radius: 18px;
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: rgba(223,225,229,0);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }

        .buttons {
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .container.active .buttons {
            display: none;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 11px 4px;
            padding: 0 16px;
            line-height: 27px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }

        #view-frame {
            display: none;
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            background: #ffffff;
        }

        .container.active + #view-frame {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container" id="search-container">
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>

        <form id="search-form" onsubmit="handleSearch(event)">
            <div class="search-box">
                <input type="text" id="query" class="search-input" autofocus autocomplete="off" placeholder="Ketik pencarian atau URL...">
            </div>
            <div class="buttons" style="text-align: center;">
                <input type="submit" class="btn" value="Google Search">
            </div>
        </form>
    </div>

    <iframe id="view-frame" name="view-frame"></iframe>

    <script>
        function handleSearch(event) {
            event.preventDefault();
            const inputVal = document.getElementById('query').value.trim();
            const container = document.getElementById('search-container');
            const iframe = document.getElementById('view-frame');

            if (!inputVal) return;

            container.classList.add('active');

            let targetUrl = '';
            
            if (inputVal.startsWith('http://') || inputVal.startsWith('https://')) {
                targetUrl = inputVal;
            } else if (inputVal.includes('.') && !inputVal.includes(' ')) {
                targetUrl = 'https://' + inputVal;
            } else {
                targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(inputVal);
            }

            iframe.src = targetUrl;
        }
    </script>

</body>
</html>
