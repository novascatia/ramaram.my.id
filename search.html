<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:image" content="logo.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="shortcut icon" type="image/png" href="logo.png" />
  
  <title>ramaram - browser</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #999;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    
    /* Nav / Search Bar Area */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 13, 13, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      z-index: 100;
      display: flex;
      justify-content: center;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .navcontent {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .nav-logo {
      color: #f1f1f1;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .search-form {
      flex: 1;
      display: flex;
    }
    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0 12px;
      height: 38px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 0.85rem;
      background: transparent;
      color: #f1f1f1;
      font-family: 'Inter', sans-serif;
    }
    .search-input::placeholder {
      color: #555;
    }

    /* Main Content / Home State */
    .container {
      padding: 160px 24px 80px;
      max-width: 580px;
      margin: 0 auto;
      text-align: center;
      transition: opacity 0.3s ease;
    }
    .container.hidden {
      display: none;
    }
    .hero-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #f1f1f1;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p { 
      margin-bottom: 28px; 
      color: #888;
      font-size: 0.9rem;
    }

    /* Iframe View State */
    #view-frame {
      display: none;
      width: 100%;
      height: calc(100vh - 71px);
      border: none;
      background: #0d0d0d;
      margin-top: 71px;
    }
    #view-frame.show {
      display: block;
    }
  </style>
</head>
<body>

  <nav id="navbar">
    <div class="navcontent">
      <a href="#" class="nav-logo" onclick="resetHome(event)">[rama]</a>
      <form class="search-form" onsubmit="handleSearch(event)">
        <div class="search-box">
          <input type="text" id="query" class="search-input" autofocus autocomplete="off" placeholder="Ketik URL atau kata kunci...">
        </div>
      </form>
    </div>
  </nav>

  <!-- Initial Landing / Home Content -->
  <div class="container" id="main-container">
    <div class="hero-tag">Private Workspace</div>
    <h1>Embedded Viewer</h1>
    <p>Masukkan URL atau kata kunci pada bilah di atas untuk mulai melihat halaman web langsung di dalam situs ini tanpa meninggalkan jejak riwayat lokal.</p>
  </div>

  <!-- Embed Frame Area -->
  <iframe id="view-frame" name="view-frame"></iframe>

  <script>
    const navbar = document.getElementById("navbar");
    const mainContainer = document.getElementById("main-container");
    const viewFrame = document.getElementById("view-frame");
    const queryInput = document.getElementById("query");

    function handleSearch(event) {
      event.preventDefault();
      const inputVal = queryInput.value.trim();
      if (!inputVal) return;

      let targetUrl = "";
      
      if (inputVal.startsWith("http://") || inputVal.startsWith("https://")) {
        targetUrl = inputVal;
      } else if (inputVal.includes(".") && !inputVal.includes(" ")) {
        targetUrl = "https://" + inputVal;
      } else {
        // Menggunakan DuckDuckGo sebagai alternatif mesin pencari ramah iframe dibanding Google
        targetUrl = "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(inputVal);
      }

      mainContainer.classList.add("hidden");
      viewFrame.classList.add("show");
      viewFrame.src = targetUrl;
    }

    function resetHome(event) {
      event.preventDefault();
      viewFrame.src = "";
      viewFrame.classList.remove("show");
      mainContainer.classList.remove("hidden");
      queryInput.value = "";
    }
  </script>
</body>
</html>
