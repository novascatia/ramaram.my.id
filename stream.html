<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RamaSRC</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff4444;
    --muted: #777777;
    --text: #eeeeee;
    --bg-dark: #111111;
    --bg-panel: #1a1a1a;
    --border: #1e1e1e;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg-dark); 
    color: var(--text); 
    font-family: 'Inter', sans-serif; 
    font-size: 14px; 
    line-height: 1.6; 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 1.2rem; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .logo-icon { color: var(--accent); font-size: 0.9rem; }
  .live-badge { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 500; }
  .live-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  
  .cat-bar { padding: 16px 32px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; overflow-x: auto;}
  .cat-btn { background: transparent; border: 1px solid #333; color: var(--muted); padding: 8px 20px; border-radius: 20px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; transition: 0.2s;}
  .cat-btn.active { background: var(--text); color: var(--bg-dark); border-color: var(--text); }

  .main { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
  @media (min-width: 900px) { .main { flex-direction: row; } }
  
  .player-side { flex: 2; padding: 32px; overflow-y: auto; }
  .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; overflow: hidden; }
  #embedArea { width: 100%; height: 100%; }
  #embedArea iframe { width: 100%; height: 100%; border: none; }
  
  .match-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  @media (min-width: 768px) { .match-bar { flex-direction: row; justify-content: space-between; align-items: center; } }
  .match-bar-teams { font-size: 1.2rem; font-weight: 500; display: flex; align-items: center; gap: 12px; }
  .match-bar-meta { color: var(--muted); font-size: 0.85rem; }
  .mbt { display: flex; align-items: center; gap: 10px; }
  .mbt img { width: 28px; height: 28px; object-fit: contain; }
  .vs-sep { font-size: 0.85rem; color: var(--muted); font-weight: 400; }
  
  .stream-switcher { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .stream-btn { background: var(--bg-dark); border: 1px solid #333; color: var(--muted); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.85rem; transition: 0.2s; }
  .stream-btn:hover { border-color: #555; color: var(--text); }
  .stream-btn.active { border-color: var(--text); color: var(--text); }

  .sidebar { flex: 1; border-top: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg-dark); max-height: 100vh; }
  @media (min-width: 900px) { .sidebar { border-top: none; border-left: 1px solid var(--border); } }
  .sidebar-header { padding: 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); font-weight: 500; }
  .match-count { color: var(--muted); font-size: 0.85rem; }
  
  .search-wrap { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .search-input { width: 100%; background: transparent; border: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; }
  .search-input::placeholder { color: #555; }
  
  .match-list { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  
  .match-item { display: flex; align-items: center; padding: 16px; background: transparent; border-radius: 8px; cursor: pointer; transition: 0.2s; border-left: 3px solid transparent; gap: 16px; }
  .match-item:hover { background: var(--bg-panel); }
  .match-item.selected { background: var(--bg-panel); border-left: 3px solid var(--text); }
  
  .match-time { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; font-size: 0.85rem; color: var(--muted); text-align: center; }
  .match-teams-col { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .team-row { display: flex; align-items: center; gap: 12px; }
  .team-badge { width: 24px; height: 24px; object-fit: contain; }
  .team-name { font-size: 0.95rem; color: var(--text); }
  
  .play-btn { color: #333; font-size: 0.8rem; transition: 0.2s; }
  .match-item:hover .play-btn, .match-item.selected .play-btn { color: var(--text); }
  
  .pinned-banner { padding: 10px 16px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 4px 0; border-radius: 6px; font-weight: 500; }
  .banner-indo { background: rgba(255, 68, 68, 0.1); color: var(--accent); }
  .banner-mu { background: rgba(255, 68, 68, 0.1); color: var(--accent); }
  .indo-highlight, .mu-highlight { font-weight: 700; color: var(--accent); }
  
  .list-divider { height: 1px; background: var(--border); margin: 16px 0; width: 100%; }

  .loader { display: flex; justify-content: center; padding: 40px; }
  .spinner { width: 28px; height: 28px; border: 2px solid #333; border-top-color: var(--text); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-icon">▶</span> RamaSRC</div>
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>
</header>

<div class="cat-bar" id="catBar">
  <button class="cat-btn active" data-cat="football">Football</button>
</div>

<div class="main" id="mainLayout">
  <div class="player-side" id="playerSide">
    <div class="stream-area" id="tabStream">
      <div id="playerBox">
        <div class="video-wrap">
          <div id="embedArea">
             <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);">Select a match to watch</div>
          </div>
        </div>
        <div class="match-bar">
          <div class="match-bar-teams" id="matchBarTeams">Select a match to watch</div>
          <div class="match-bar-meta" id="matchBarMeta"></div>
        </div>
        <div class="stream-switcher" id="streamSwitcher" style="display:none;"></div>
      </div>
    </div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>Up Next</span>
      <span class="match-count" id="matchCount">0 matches</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Search teams or events..." autocomplete="off">
    </div>
    <div class="match-list" id="matchList">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script>
const apiProxy = '/.netlify/functions/sportsrc-proxy';
let currentCategory = 'football';
let allMatches = [];

const countryCodes = {
  "indonesia": "id", "mexico": "mx", "england": "gb-eng", "spain": "es",
  "italy": "it", "germany": "de", "france": "fr", "brazil": "br",
  "argentina": "ar", "portugal": "pt", "netherlands": "nl", "belgium": "be",
  "croatia": "hr", "uruguay": "uy", "usa": "us", "united states": "us", "japan": "jp",
  "south korea": "kr", "korea republic": "kr", "saudi arabia": "sa", "australia": "au",
  "qatar": "qa", "malaysia": "my", "thailand": "th", "vietnam": "vn", "singapore": "sg",
  "philippines": "ph", "myanmar": "mm", "cambodia": "kh", "scotland": "gb-sct",
  "wales": "gb-wls", "ireland": "ie", "switzerland": "ch", "denmark": "dk",
  "sweden": "se", "norway": "no", "finland": "fi", "poland": "pl", "ukraine": "ua",
  "austria": "at", "turkey": "tr", "morocco": "ma", "senegal": "sn", "egypt": "eg",
  "ghana": "gh", "cameroon": "cm", "colombia": "co", "chile": "cl", "peru": "pe",
  "ecuador": "ec", "paraguay": "py", "venezuela": "ve", "bolivia": "bo", "canada": "ca",
  "china": "cn", "india": "in", "iraq": "iq", "iran": "ir", "uae": "ae", "uzbekistan": "uz",
  "bahrain": "bh", "oman": "om", "jordan": "jo", "syria": "sy", "lebanon": "lb", "palestine": "ps"
};

function getFallbackIcon(name) {
  if (!name) return 'notfound.jpeg';
  let cleanName = name.toLowerCase()
    .replace(/u-?\d+/g, '')
    .replace(/\b(women|men|fc|timnas)\b/g, '')
    .trim();
    
  if (countryCodes[cleanName]) {
    return `https://flagcdn.com/w40/${countryCodes[cleanName]}.png`;
  }
  return 'notfound.jpeg';
}

window.getFallbackIcon = getFallbackIcon;

document.getElementById('searchInput').addEventListener('input', e => {
  const queryText = e.target.value.trim().toLowerCase();
  renderList(queryText ? allMatches.filter(m => matchLabel(m).toLowerCase().includes(queryText)) : allMatches);
});

async function apiFetch(params) {
  try {
    const res = await fetch(apiProxy + '?' + new URLSearchParams(params));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch(e) { return { error: e.message }; }
}

function getHome(m) { return m.teams?.home?.name || m.title?.split(' vs ')[0] || m.title || '?'; }

function getAway(m) { 
  if (m.teams?.away?.name) return m.teams.away.name;
  if (m.title?.includes(' vs ')) return m.title.split(' vs ')[1];
  return null;
}

function matchLabel(m) { 
  const h = getHome(m);
  const a = getAway(m);
  return a ? h + ' ' + a : h;
}

function getPinType(m) {
  const label = matchLabel(m).toLowerCase();
  if (label.includes('manchester united')) return 'MU';
  if (label.includes('indonesia')) return 'INDO';
  return null;
}

function formatTime(ms) {
  return new Date(ms).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jakarta' }) + ' WIB';
}

function formatDateShort(ms) {
  return new Date(ms).toLocaleDateString('en-GB', { day:'numeric', month:'short', timeZone:'Asia/Jakarta' });
}

function formatDateTimeFull(ms) {
  return new Date(ms).toLocaleString('en-US', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jakarta' }) + ' WIB';
}

function badgeImg(url, alt) {
  const fallbackUrl = getFallbackIcon(alt);
  if (!url) {
    return `<img class="team-badge" src="${fallbackUrl}" alt="${alt}" onerror="this.onerror=null;this.src='notfound.jpeg';">`;
  }
  return `<img class="team-badge" src="${url}" alt="${alt}" onerror="if(this.src!=='${fallbackUrl}') { this.src='${fallbackUrl}'; } else { this.onerror=null; this.src='notfound.jpeg'; }">`;
}

async function loadMatches(cat) {
  document.getElementById('matchList').innerHTML = '<div class="loader"><div class="spinner"></div></div>';
  const res = await apiFetch({ data: 'matches', category: cat });
  if (res.error || !res.success) {
    document.getElementById('matchList').innerHTML = '<div style="padding:20px; color:#ff6b6b; text-align:center;">Failed to load: ' + (res.error||'') + '</div>';
    return;
  }
  allMatches = res.data || [];
  document.getElementById('matchCount').textContent = allMatches.length + ' matches';
  renderList(allMatches);
}

function renderList(matches) {
  const list = document.getElementById('matchList');
  if (!matches.length) { list.innerHTML = '<div style="padding:40px 20px; text-align:center; color:var(--muted); font-size: 14px;">No matches found.</div>'; return; }

  const pinnedMU = matches.filter(m => getPinType(m) === 'MU');
  const pinnedIndo = matches.filter(m => getPinType(m) === 'INDO');
  const rest = matches.filter(m => !getPinType(m));
  
  list.innerHTML = '';

  if (pinnedIndo.length) {
    const banner = document.createElement('div');
    banner.className = 'pinned-banner banner-indo';
    banner.innerHTML = `<span>🦅 Pinned by Garuda Fans</span>`;
    list.appendChild(banner);
    pinnedIndo.forEach(m => list.appendChild(makeItem(m, 'INDO')));
  }

  if (pinnedMU.length) {
    const banner = document.createElement('div');
    banner.className = 'pinned-banner banner-mu';
    banner.innerHTML = `<span>🔴 Pinned by The Reds</span>`;
    list.appendChild(banner);
    pinnedMU.forEach(m => list.appendChild(makeItem(m, 'MU')));
  }

  if ((pinnedIndo.length || pinnedMU.length) && rest.length) {
    const divider = document.createElement('div');
    divider.className = 'list-divider';
    list.appendChild(divider);
  }

  rest.forEach(m => list.appendChild(makeItem(m, null)));
}

function makeItem(m, pinType) {
  const el = document.createElement('div');
  el.className = 'match-item';
  
  const home = getHome(m);
  const away = getAway(m);
  const isSingle = !away || away === '?';

  const isLive = m.live === true;
  let timeDisplay = 'TBD';
  if (isLive) {
    timeDisplay = '<span style="color:var(--accent); font-weight:700;">LIVE</span>';
  } else if (m.date) {
    timeDisplay = `<span style="font-size:11px; display:block; margin-bottom:4px; opacity:0.7;">${formatDateShort(m.date)}</span><span>${formatTime(m.date).replace(' WIB', '')}</span>`;
  }
  
  const homeHighlight = (pinType === 'MU' && home.toLowerCase().includes('manchester united')) || (pinType === 'INDO' && home.toLowerCase().includes('indonesia'));
  const hClass = homeHighlight ? (pinType === 'MU' ? ' mu-highlight' : ' indo-highlight') : '';

  let teamsHtml = '';
  if (isSingle) {
    teamsHtml = `<div class="team-row">${badgeImg(m.teams?.home?.badge,home)}<span class="team-name single-event-title ${hClass}">${home}</span></div>`;
  } else {
    const awayHighlight = (pinType === 'MU' && away.toLowerCase().includes('manchester united')) || (pinType === 'INDO' && away.toLowerCase().includes('indonesia'));
    const aClass = awayHighlight ? (pinType === 'MU' ? ' mu-highlight' : ' indo-highlight') : '';
    teamsHtml = 
      `<div class="team-row">${badgeImg(m.teams?.home?.badge,home)}<span class="team-name${hClass}">${home}</span></div>` +
      `<div class="team-row">${badgeImg(m.teams?.away?.badge,away)}<span class="team-name${aClass}">${away}</span></div>`;
  }

  el.innerHTML =
    `<div class="match-time">${timeDisplay}</div>` +
    `<div class="match-teams-col">` + teamsHtml + `</div>` +
    `<div class="play-btn">▶</div>`;

  el.addEventListener('click', () => {
    document.querySelectorAll('.match-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    
    document.getElementById('mainLayout').classList.add('active-player');
    
    if (window.innerWidth <= 900) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    loadStream(m.category || currentCategory, m.id, m);
  });
  return el;
}

async function loadStream(cat, id, m) {
  const home = getHome(m);
  const away = getAway(m);
  const isSingle = !away || away === '?';

  let matchBarTeamsHtml = '';
  if (isSingle) {
    matchBarTeamsHtml = `<div class="mbt">${badgeImg(m.teams?.home?.badge,home)}<span>${home}</span></div>`;
  } else {
    matchBarTeamsHtml = 
      `<div class="mbt">${badgeImg(m.teams?.home?.badge,home)}<span>${home}</span></div>` +
      `<span class="vs-sep">VS</span>` +
      `<div class="mbt"><span>${away}</span>${badgeImg(m.teams?.away?.badge,away)}</div>`;
  }

  document.getElementById('matchBarTeams').innerHTML = matchBarTeamsHtml;
  document.getElementById('matchBarMeta').textContent = m.live ? '🔴 LIVE STREAM' : (m.date ? formatDateTimeFull(m.date) : 'Upcoming');

  const ea = document.getElementById('embedArea');
  ea.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>';
  const sw = document.getElementById('streamSwitcher');
  sw.style.display = 'none'; sw.innerHTML = '';

  if (m.date && !m.live) {
    const diff = m.date - Date.now();
    if (diff > 10 * 60 * 1000) {
      const countdownId = 'cd_' + Date.now();
      ea.innerHTML = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center; background:#0f0f0f;">
        <div style="font-size:40px">⏳</div>
        <div style="font-size:24px; font-weight:700; color:var(--text)">STREAM NOT READY</div>
        <div style="font-size:14px; color:var(--muted); max-width:320px; line-height:1.6;">You can access the stream 10 minutes before the match starts!</div>
        <div style="font-size:16px; font-weight:500; color:var(--accent); margin-top:12px;" id="${countdownId}"></div>
      </div>`;

      function fmtCountdown() {
        const rem = m.date - Date.now();
        if (rem <= 0) return null;
        const totalSec = Math.floor(rem / 1000);
        const h = Math.floor(totalSec / 3600);
        const min = Math.floor((totalSec % 3600) / 60);
        const sec = totalSec % 60;
        return (h > 0 ? `${h}h ` : '') + `${min}m ${String(sec).padStart(2,'0')}s`;
      }

      const el = document.getElementById(countdownId);
      if (el) el.textContent = 'Starts in: ' + (fmtCountdown() || '');

      const timer = setInterval(() => {
        const el = document.getElementById(countdownId);
        if (!el) { clearInterval(timer); return; }
        const val = fmtCountdown();
        if (!val) { clearInterval(timer); el.textContent = 'Starting now!'; return; }
        el.textContent = 'Starts in: ' + val;
      }, 1000);
      return;
    }
  }

  const res = await apiFetch({ data: 'detail', category: cat, id });
  if (res.error || !res.success) {
    ea.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ff6b6b;font-weight:500;">Failed to load video: ${res.error||''}</div>`;
    return;
  }

  const sources = res.data?.sources || [];

  function applyEmbed(src) {
    const url = src.embedUrl || src.embed || src.url || '';
    if (!url) return false;
    ea.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay;encrypted-media;picture-in-picture" referrerpolicy="no-referrer"></iframe>`;
    return true;
  }

  if (sources.length > 0) {
    applyEmbed(sources[0]);
    if (sources.length > 1) {
      sw.style.display = 'flex';
      sources.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.className = 'stream-btn' + (i === 0 ? ' active' : '');
        btn.textContent = (s.name || 'Server ' + (s.streamNo || i+1)) + (s.hd ? ' [HD]' : '');
        btn.addEventListener('click', () => {
          sw.querySelectorAll('.stream-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyEmbed(s);
        });
        sw.appendChild(btn);
      });
    }
  } else {
    ea.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);">Stream not available yet.</div>`;
  }
}

loadMatches(currentCategory);
</script>
</body>
</html>
